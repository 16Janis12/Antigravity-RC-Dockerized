services:
  antigravity:
    image: ghcr.io/16janis12/antigravity-rc-dockerized:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-remote-daemon
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - AGY_INSTANCE_NAME=${AGY_INSTANCE_NAME:-docker-instance}
      - AGY_HUB_PORT=${AGY_HUB_PORT:-4400}
      - ENABLE_COMMUNITY_SKILLS=${ENABLE_COMMUNITY_SKILLS:-false}
      - AGY_PLUGINS=${AGY_PLUGINS:-}
    volumes:
      # Persistent named volume for auth credentials and user settings
      - gemini_config:/home/antigravity/.gemini
      # Persistent named volume for logs and runtime data
      - antigravity_data:/home/antigravity/.antigravity
      # Mount local projects directory into container workspace
      - ./workspace:/workspace
    ports:
      - "4400:4400"

volumes:
  gemini_config:
    driver: local
  antigravity_data:
    driver: local

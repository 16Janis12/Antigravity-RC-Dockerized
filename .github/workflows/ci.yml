name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: antigravity-remote-daemon:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Sanity check entrypoint & CLI in container
        run: |
          docker run --rm antigravity-remote-daemon:test /bin/bash -c "agy --version || true"
